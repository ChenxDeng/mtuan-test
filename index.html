<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f4ec">
<title>OPEN WINDOW · 把心事交给风</title>
<meta name="description" content="一扇敞开的窗，两架纸飞机，一张等待心事的信纸。">
<link rel="icon" href="data:,">
<link rel="preload" href="assets/fonts/AmaticaSC-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="assets/city-scene-clean.png" as="image">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<main class="room" aria-label="窗边的情绪日记">
  <h1 class="wordmark" aria-label="OPEN WINDOW"><span>Open</span><span>Window</span></h1>
  <div class="scene" aria-label="手绘小城窗景">
    <img class="scene-background" src="assets/city-scene-clean.png" width="1666" height="944" alt="敞开的手绘窗户外，是欧洲小城的屋顶、绿树和教堂尖顶，蓝天上的云缓缓飘过。" draggable="false">
    <div class="cloud-layer" aria-hidden="true">
      <img class="cloud cloud--left" src="assets/parts/city-cloud-left.png" alt="" draggable="false">
      <img class="cloud cloud--small" src="assets/parts/city-cloud-small.png" alt="" draggable="false">
      <img class="cloud cloud--high" src="assets/parts/city-cloud-high.png" alt="" draggable="false">
    </div>
    <button class="keepsake keepsake--pink" type="button" data-piece="pink" aria-label="别人的烦恼" aria-describedby="hint-pink">
      <span class="object-shadow" aria-hidden="true"><img src="assets/parts/city-plane-left.png" alt="" draggable="false"></span>
      <span class="object-body"><img src="assets/parts/city-plane-left.png" alt="" draggable="false"></span>
      <span class="hint" id="hint-pink" role="tooltip">别人的烦恼</span>
    </button>
    <button class="keepsake keepsake--blue" type="button" data-piece="blue" aria-label="我的回信" aria-describedby="hint-blue">
      <span class="object-shadow" aria-hidden="true"><img src="assets/parts/city-plane-right.png" alt="" draggable="false"></span>
      <span class="object-body"><img src="assets/parts/city-plane-right.png" alt="" draggable="false"></span>
      <span class="hint" id="hint-blue" role="tooltip">我的回信</span>
    </button>
    <button class="keepsake keepsake--letter" type="button" data-piece="letter" aria-label="写下烦恼" aria-describedby="hint-letter">
      <span class="object-shadow" aria-hidden="true"><img src="assets/parts/city-letter-pen.png" alt="" draggable="false"></span>
      <span class="object-body"><img src="assets/parts/city-letter-pen.png" alt="" draggable="false"></span>
      <span class="hint" id="hint-letter" role="tooltip">写下烦恼</span>
    </button>
  </div>
</main>
</body>
</html>
